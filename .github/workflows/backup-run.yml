# The backup itself, called by the weekly job (backup.yml) and before every
# migration reaches production (migrate.yml): the database dump, every
# storage object and the manifest, packed as one archive and encrypted with
# age to the public key in the BACKUP_AGE_PUBLIC_KEY variable. The private
# key never comes here: only its holder can open an artifact.
#
# The repo is public, so its logs are too. Credentials reach the steps only
# as environment variables; nothing is traced or echoed; the database
# password is masked on its own as well; and only counts and byte totals
# are printed, never object paths (they carry user ids).
name: Backup (run)

on:
  workflow_call:
    outputs:
      stamp:
        description: The backup's timestamp, which names its artifact.
        value: ${{ jobs.backup.outputs.stamp }}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stamp: ${{ steps.pack.outputs.stamp }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      BACKUP_AGE_PUBLIC_KEY: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
    steps:
      - name: Check configuration (names only)
        run: |
          set +x
          missing=0
          for name in SUPABASE_DB_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL BACKUP_AGE_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then echo "✖ $name is not set"; missing=1; fi
          done
          case "$BACKUP_AGE_PUBLIC_KEY" in age1*) ;; *) echo "✖ BACKUP_AGE_PUBLIC_KEY is not an age public key"; missing=1 ;; esac
          # The direct connection (db.<ref>.supabase.co) is IPv6 only, and
          # GitHub's runners have no IPv6: the Session pooler is required.
          # Only the verdict is printed, never the host.
          if python3 -c 'import os, sys, urllib.parse; h = urllib.parse.urlsplit(os.environ["SUPABASE_DB_URL"]).hostname or ""; sys.exit(0 if h.startswith("db.") and h.endswith(".supabase.co") else 1)'; then
            echo "✖ SUPABASE_DB_URL is the direct connection (IPv6 only). Use Connect → Session pooler (port 5432)."
            missing=1
          fi
          exit $missing

      - name: Mask the database password on its own
        run: |
          set +x
          password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.unquote(urllib.parse.urlsplit(os.environ["SUPABASE_DB_URL"]).password or ""))')"
          if [ -n "$password" ]; then echo "::add-mask::$password"; fi
          raw="$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ["SUPABASE_DB_URL"]).password or "")')"
          if [ -n "$raw" ]; then echo "::add-mask::$raw"; fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age > /dev/null

      - name: Dump the database and download storage
        env:
          BACKUP_OUT: ${{ runner.temp }}/weming-backup
        run: |
          set +x
          ./scripts/backup.sh

      - name: Pack and encrypt
        id: pack
        run: |
          set +x
          cd "$RUNNER_TEMP"
          stamp="$(ls weming-backup/*.sql | head -1 | xargs -n1 basename | sed 's/\.sql$//')"
          tar -C weming-backup -czf "weming-backup-${stamp}.tar.gz" .
          age -r "$BACKUP_AGE_PUBLIC_KEY" -o "weming-backup-${stamp}.tar.gz.age" "weming-backup-${stamp}.tar.gz"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"

      - name: Verify the archive's age header (no decryption)
        run: |
          set +x
          file="$RUNNER_TEMP/weming-backup-${{ steps.pack.outputs.stamp }}.tar.gz.age"
          [ "$(head -c 21 "$file")" = "age-encryption.org/v1" ] || { echo "✖ not an age file"; exit 1; }
          stanzas="$(head -c 1024 "$file" | grep -a -c '^-> X25519 ' || true)"
          [ "$stanzas" = "1" ] || { echo "✖ expected exactly one X25519 recipient, found $stanzas"; exit 1; }
          echo "✓ age v1 header, one X25519 recipient"

      - name: Round trip with a throwaway key
        run: |
          set +x
          cd "$RUNNER_TEMP"
          plain="weming-backup-${{ steps.pack.outputs.stamp }}.tar.gz"
          age-keygen -o roundtrip.key 2> /dev/null
          age -r "$(age-keygen -y roundtrip.key)" -o roundtrip.age "$plain"
          [ "$(age -d -i roundtrip.key roundtrip.age | sha256sum)" = "$(sha256sum < "$plain")" ] ||
            { echo "✖ round trip changed the archive"; exit 1; }
          tar -tzf "$plain" > /dev/null || { echo "✖ archive does not list"; exit 1; }
          rm -f roundtrip.key roundtrip.age
          echo "✓ encrypt → decrypt with a throwaway key returns the same archive, and it lists"

      - name: Summary (counts and sizes only)
        run: |
          set +x
          cd "$RUNNER_TEMP"
          stamp="${{ steps.pack.outputs.stamp }}"
          python3 - "$stamp" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          stamp = sys.argv[1]
          m = json.load(open(f"weming-backup/{stamp}/storage/manifest.json"))
          sql = os.path.getsize(f"weming-backup/{stamp}.sql")
          enc = os.path.getsize(f"weming-backup-{stamp}.tar.gz.age")
          print(f"### Backup {stamp}")
          print(f"- storage: {m['objects']} objects, {m['bytes']} bytes")
          for name, b in m["buckets"].items():
              print(f"  - {name}: {b['objects']} objects, {b['bytes']} bytes")
          print(f"- database dump: {sql} bytes")
          print(f"- encrypted archive: {enc} bytes")
          PY

      - name: Remove the plaintext
        run: |
          cd "$RUNNER_TEMP"
          rm -rf weming-backup "weming-backup-${{ steps.pack.outputs.stamp }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: weming-backup-${{ steps.pack.outputs.stamp }}
          path: ${{ runner.temp }}/weming-backup-${{ steps.pack.outputs.stamp }}.tar.gz.age
          retention-days: 60
          compression-level: 0
          if-no-files-found: error
