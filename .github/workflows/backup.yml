# Weekly backup of production (backup-run.yml does the work, and runs
# before every migration too). Only its holder's private key opens an
# artifact; the logs print counts and byte totals only.
name: Backup

on:
  schedule:
    - cron: '0 3 * * 0' # Sundays, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    uses: ./.github/workflows/backup-run.yml
    secrets: inherit
