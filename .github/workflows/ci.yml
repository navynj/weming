# The gate, in CI (review): types, lint and format once, and the
# non-database suite in three shards run in parallel, on every push to main.
# The database tests run locally before every push (.githooks/pre-push).
# Vercel waits for this whole run before a production build and skips the
# build unless every job passed (scripts/vercel-ignore.mjs, vercel.json
# ignoreCommand); the build itself only builds.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PageProps, LayoutProps and the route types are generated, not committed.
      - name: Generate route types
        run: pnpm exec next typegen

      - name: Types
        run: pnpm exec tsc --noEmit -p .

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm exec prettier --check .

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests (no database), shard ${{ matrix.shard }} of 3
        run: pnpm test:ci --shard=${{ matrix.shard }}/3
